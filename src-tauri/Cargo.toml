[package]
name = "toolsiano-desktop"
version = "1.0.3"
description = "Private offline tools for images, PDFs, passwords and QR codes"
authors = ["Toolsiano"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
