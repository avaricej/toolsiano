name: Check application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        with:
          name: toolsiano-dist-${{ matrix.browser }}
          path: dist
          retention-days: 14
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: docker build -t toolsiano:test .
      - run: docker run -d --name toolsiano-test -p 8080:80 -e SITE_ADDRESS=:80 toolsiano:test
      - name: Wait for Caddy and check HTTP responses
        run: node scripts/check-container.mjs http://127.0.0.1:8080
      - name: Container diagnostics
        if: failure()
        run: |
          docker ps -a --filter name=toolsiano-test
          docker logs toolsiano-test
      - if: always()
        run: docker rm -f toolsiano-test
