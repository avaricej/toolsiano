name: Build desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
            bundles: nsis
          # The 32-bit application has its own Windows installer.
          - os: windows-latest
            target: i686-pc-windows-msvc
            architecture: x86
            bundles: nsis
          - os: macos-latest
            target: universal-apple-darwin
            architecture: universal
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            architecture: x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: rustup toolchain install stable --profile minimal
      - if: runner.os != 'macOS'
        run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - run: node scripts/package-desktop.mjs --architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v6
        with:
          name: toolsiano-${{ runner.os }}-${{ matrix.architecture }}
          path: work/desktop-packages
          retention-days: 14
